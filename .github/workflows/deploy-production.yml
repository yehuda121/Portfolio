# Monorepo production deployment: AWS Lambda (backend) + Firebase Hosting (frontend)
# Triggers on push to main or manual dispatch. Does not deploy if checks/build fail.

name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Validation (must pass before any deployment)
  # ---------------------------------------------------------------------------

  backend-check:
    name: Backend — validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  frontend-check:
    name: Frontend — test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          CI: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: portfolio-frontend/build
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Deployment (only after BOTH check jobs succeed)
  # ---------------------------------------------------------------------------

  deploy-backend:
    name: Backend — deploy Lambda
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
    defaults:
      run:
        working-directory: portfolio-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create deployment package
        run: |
          zip -r function.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".env" \
            -x ".env.*" \
            -x "*.env" \
            -x "*serviceAccount*" \
            -x "*adminsdk*" \
            -x "Dockerfile" \
            -x "docker-compose*" \
            -x "*.md" \
            -x "src/scripts/*" \
            -x "coverage/*" \
            -x "test/*" \
            -x "tests/*" \
            -x "**/*.test.js" \
            -x "**/*.spec.js" \
            -x "function.zip" \
            -x "lambda.zip"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file "fileb://function.zip"

  deploy-frontend:
    name: Frontend — deploy Firebase Hosting
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
    outputs:
      firebase_outcome: ${{ steps.firebase_deploy.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: portfolio-frontend/build

      # Intentionally allowed to continue:
      # Firebase Hosting may occasionally return a non-critical failure/no-op
      # condition (for example "current active version") when a push is
      # effectively backend-only or the Hosting release is already live.
      # Without continue-on-error, that condition can block backend deploy
      # reporting / overall workflow success even when Lambda updated fine.
      #
      # Job output firebase_outcome still records the real step outcome so
      # notifications do not claim Hosting succeeded when it did not.
      #
      # If Firebase starts hiding real Hosting failures, disable
      # continue-on-error temporarily while diagnosing the deployment.
      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: ./portfolio-frontend

      - name: Report Firebase deploy outcome
        run: |
          OUTCOME="${{ steps.firebase_deploy.outcome }}"
          echo "firebase_outcome=${OUTCOME}"
          if [ "$OUTCOME" = "success" ]; then
            echo "Firebase Hosting deploy succeeded."
          else
            echo "::warning::Firebase Hosting deploy step outcome=${OUTCOME}. Workflow continues so backend deploy is not blocked; notifications will report Hosting as not successful."
          fi

  # ---------------------------------------------------------------------------
  # Email notification (success or failure)
  # ---------------------------------------------------------------------------

  notify:
    name: Notify — deployment result
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
      - deploy-backend
      - deploy-frontend
    if: always()
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DEPLOY_NOTIFY_EMAIL: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}

    steps:
      - name: Skip email notification (SMTP not configured)
        if: >-
          ${{ env.SMTP_SERVER == ''
          || env.SMTP_PORT == ''
          || env.SMTP_USERNAME == ''
          || env.SMTP_PASSWORD == ''
          || env.SMTP_FROM == ''
          || env.DEPLOY_NOTIFY_EMAIL == '' }}
        run: echo "SMTP secrets not configured; skipping email notification."

      # Full success: checks + Lambda + Firebase step outcome all succeeded
      - name: Send success email
        if: >-
          ${{ env.SMTP_SERVER != ''
          && env.SMTP_PORT != ''
          && env.SMTP_USERNAME != ''
          && env.SMTP_PASSWORD != ''
          && env.SMTP_FROM != ''
          && env.DEPLOY_NOTIFY_EMAIL != ''
          && needs.backend-check.result == 'success'
          && needs.frontend-check.result == 'success'
          && needs.deploy-backend.result == 'success'
          && needs.deploy-frontend.result == 'success'
          && needs.deploy-frontend.outputs.firebase_outcome == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Portfolio] Production deployment succeeded"
          to: ${{ env.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ env.SMTP_FROM }}
          body: |
            Production deployment completed successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Job results:
            - Backend validate: ${{ needs.backend-check.result }}
            - Frontend test & build: ${{ needs.frontend-check.result }}
            - Backend deploy (Lambda): ${{ needs.deploy-backend.result }}
            - Frontend deploy job: ${{ needs.deploy-frontend.result }}
            - Firebase Hosting step outcome: ${{ needs.deploy-frontend.outputs.firebase_outcome }}

      # Lambda OK, but Firebase step did not succeed (continue-on-error soft-fail)
      - name: Send partial success email (backend OK, Firebase not successful)
        if: >-
          ${{ env.SMTP_SERVER != ''
          && env.SMTP_PORT != ''
          && env.SMTP_USERNAME != ''
          && env.SMTP_PASSWORD != ''
          && env.SMTP_FROM != ''
          && env.DEPLOY_NOTIFY_EMAIL != ''
          && needs.backend-check.result == 'success'
          && needs.frontend-check.result == 'success'
          && needs.deploy-backend.result == 'success'
          && needs.deploy-frontend.result == 'success'
          && needs.deploy-frontend.outputs.firebase_outcome != 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Portfolio] Partial deployment — Lambda OK, Firebase not successful"
          to: ${{ env.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ env.SMTP_FROM }}
          body: |
            Backend (Lambda) deployed successfully, but Firebase Hosting did not report success.

            The Firebase step uses continue-on-error so backend-only / no-op Hosting
            conditions do not block Lambda. Review Hosting logs before assuming the
            live site was updated.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Job results:
            - Backend validate: ${{ needs.backend-check.result }}
            - Frontend test & build: ${{ needs.frontend-check.result }}
            - Backend deploy (Lambda): ${{ needs.deploy-backend.result }}
            - Frontend deploy job: ${{ needs.deploy-frontend.result }}
            - Firebase Hosting step outcome: ${{ needs.deploy-frontend.outputs.firebase_outcome }}

      - name: Send failure email
        if: >-
          ${{ env.SMTP_SERVER != ''
          && env.SMTP_PORT != ''
          && env.SMTP_USERNAME != ''
          && env.SMTP_PASSWORD != ''
          && env.SMTP_FROM != ''
          && env.DEPLOY_NOTIFY_EMAIL != ''
          && !(needs.backend-check.result == 'success'
          && needs.frontend-check.result == 'success'
          && needs.deploy-backend.result == 'success'
          && needs.deploy-frontend.result == 'success') }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[Portfolio] Production deployment FAILED"
          to: ${{ env.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ env.SMTP_FROM }}
          body: |
            Production deployment did not complete successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Job results:
            - Backend validate: ${{ needs.backend-check.result }}
            - Frontend test & build: ${{ needs.frontend-check.result }}
            - Backend deploy (Lambda): ${{ needs.deploy-backend.result }}
            - Frontend deploy job: ${{ needs.deploy-frontend.result }}
            - Firebase Hosting step outcome: ${{ needs.deploy-frontend.outputs.firebase_outcome }}

            Review the workflow logs for details.
